name: ${COMPOSE_PROJECT_NAME:-roseman}

x-roseman-service: &roseman-service
  image: ${ROSEMAN_IMAGE:-roseman:local}
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  depends_on:
    mongodb:
      condition: service_healthy
  networks:
    - app-network

services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-secret}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username ${MONGO_ROOT_USER:-admin} --password ${MONGO_ROOT_PASSWORD:-secret} --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 })'",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - app-network

  rest-api:
    <<: *roseman-service
    env_file:
      - .env
    environment:
      MONGODB_URI: "mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-secret}@mongodb:27017/${MONGO_DATABASE:-roseman}?authSource=admin"
    ports:
      - "${REST_PORT:-3000}:3000"

  indexer-polkadot:
    <<: *roseman-service
    env_file:
      - .env
      - .env.polkadot
    environment:
      MONGODB_URI: "mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-secret}@mongodb:27017/${MONGO_DATABASE:-roseman}?authSource=admin"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mongodb-data:

networks:
  app-network:
    driver: bridge
